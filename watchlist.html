<body class="min-h-screen font-sans antialiased">
    <main>
      <div class="max-w-md mx-auto min-h-screen bg-background relative">
        <header class="sticky top-0 z-30 bg-card border-b border-border shadow-sm" id="status-bar">
          <div class="px-3 pt-2 pb-1 flex items-center justify-between text-xs text-muted-foreground">
            <span id="tick-time" class="tabular-nums">--:--:--</span>
            <span class="text-[10px] cjk-wrap">实时行情 · 数据仅供参考</span>
          </div>
          <div id="risk-disclaimer" class="px-3 py-1 bg-primary-50 text-[10px] text-primary-700 cjk-wrap leading-tight">
            风险提示：内容仅为公开市场数据整理，不构成投资建议，历史表现不代表未来走势。
          </div>
          <div class="px-3 py-2 flex items-center justify-between gap-3">
            <div class="flex items-center gap-2 min-w-0">
              <h1 class="text-lg font-bold text-foreground cjk-wrap">自选股</h1>
              <span id="watch-count" class="inline-flex items-center rounded-sm bg-primary-100 px-1.5 py-0.5 text-[10px] font-semibold text-primary-700">0 只</span>
            </div>
          </div>
          <div id="index-ticker" class="px-3 py-2 bg-muted/50">
            <div class="grid grid-cols-3 gap-2">
              <div class="index-item text-center" data-index="上证指数" data-code="000001">
                <div class="text-xs font-medium text-foreground mb-0.5"><span class="index-name">上证指数</span><span class="index-arrow ml-0.5" style="color: var(--brand-state-up);">↑</span></div>
                <div class="text-sm font-bold tabular-nums index-value" style="color: var(--brand-state-up);">--</div>
                <div class="text-[10px] font-medium tabular-nums index-change" style="color: var(--brand-state-up);">--</div>
              </div>
              <div class="index-item text-center" data-index="创业板指" data-code="399006">
                <div class="text-xs font-medium text-foreground mb-0.5"><span class="index-name">创业板指</span><span class="index-arrow ml-0.5" style="color: var(--brand-state-up);">↑</span></div>
                <div class="text-sm font-bold tabular-nums index-value" style="color: var(--brand-state-up);">--</div>
                <div class="text-[10px] font-medium tabular-nums index-change" style="color: var(--brand-state-up);">--</div>
              </div>
              <div class="index-item text-center" data-index="科创50" data-code="000688">
                <div class="text-xs font-medium text-foreground mb-0.5"><span class="index-name">科创50</span><span class="index-arrow ml-0.5" style="color: var(--brand-state-up);">↑</span></div>
                <div class="text-sm font-bold tabular-nums index-value" style="color: var(--brand-state-up);">--</div>
                <div class="text-[10px] font-medium tabular-nums index-change" style="color: var(--brand-state-up);">--</div>
              </div>
            </div>
          </div>
        </header>

        <nav class="bg-card px-3 border-b border-border">
          <div class="flex gap-4 overflow-x-auto no-scrollbar" role="tablist" aria-label="行情视图">
            <a id="tab-ladder" role="tab" href="index.html" class="py-2.5 text-sm font-medium text-muted-foreground hover:text-foreground transition-colors whitespace-nowrap">连板天梯</a>
            <a id="tab-sectors" role="tab" href="sectors.html" class="py-2.5 text-sm font-medium text-muted-foreground hover:text-foreground transition-colors whitespace-nowrap">板块涨停</a>
            <a id="tab-dragon" role="tab" href="dragon-tiger.html" class="py-2.5 text-sm font-medium text-muted-foreground hover:text-foreground transition-colors whitespace-nowrap">龙虎榜</a>
            <a id="tab-broken" role="tab" href="broken-boards.html" class="py-2.5 text-sm font-medium text-muted-foreground hover:text-foreground transition-colors whitespace-nowrap">炸板池</a>
            <a id="tab-watch" role="tab" href="watchlist.html" class="relative py-2.5 text-sm font-semibold text-primary border-b-2 border-primary whitespace-nowrap">自选股</a>
          </div>
        </nav>

        <!-- Search -->
        <section class="px-3 py-3 bg-card border-b border-border">
          <div class="relative">
            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-muted-foreground"></i>
            <input id="watch-search" type="text" inputmode="search" autocomplete="off"
              class="w-full pl-9 pr-9 py-2 rounded-md bg-muted border border-border text-sm text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring"
              placeholder="输入代码 / 名称 / 拼音搜索股票">
            <button id="search-clear" type="button" class="hidden absolute right-2 top-1/2 -translate-y-1/2 p-1 text-muted-foreground hover:text-foreground">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>
          <div id="search-results" class="mt-2 hidden rounded-md border border-border bg-card shadow-sm overflow-hidden"></div>
        </section>

        <!-- Watchlist -->
        <section id="watchlist-view" class="bg-card">
          <div id="watchlist-list"></div>
        </section>

        <!-- Error state -->
        <section id="error-state" class="hidden px-4 py-12 text-center" aria-live="assertive">
          <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-destructive/10 mb-3">
            <i data-lucide="alert-circle" class="w-6 h-6 text-destructive"></i>
          </div>
          <h2 class="text-base font-semibold text-foreground mb-1">行情加载失败</h2>
          <p class="text-sm text-muted-foreground mb-3">网络连接异常或数据源暂时不可用。</p>
          <button onclick="loadWatchlist()" class="px-4 py-2 rounded-md bg-primary text-primary-foreground text-sm font-medium">重新加载</button>
        </section>

        <footer class="real-time-footer px-3 py-3 bg-card border-t border-border">
          <div class="flex items-center justify-between text-xs text-muted-foreground">
            <div class="flex items-center gap-1.5">
              <span class="relative flex h-2 w-2">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-state-up opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2" style="background-color: var(--brand-state-up);"></span>
              </span>
              <span class="tabular-nums" id="footer-tick-time">--:--:--</span>
            </div>
            <span class="text-[10px] cjk-wrap" id="footer-desc">自选股 · 东方财富实时行情</span>
          </div>
        </footer>
      </div>
    </main>

    <style>
      :root { --market-up: var(--brand-state-up); --market-down: var(--brand-state-down); }
      .bg-state-up-bg { background-color: var(--brand-state-up-bg); }
      .bg-state-down-bg { background-color: var(--brand-state-down-bg); }
      .text-state-up { color: var(--brand-state-up); }
      .text-state-down { color: var(--brand-state-down); }
      .rounded-pill { border-radius: var(--brand-radius-pill); }
      .tabular-nowrap { white-space: nowrap; font-variant-numeric: tabular-nums; }
      html, body { overflow-x: hidden; }
      main > div { max-width: 28rem; }
      header { position: sticky; top: 0; }
      .real-time-footer { margin-top: auto; }
      .search-result-row { cursor: pointer; }
      .search-result-row:hover { background-color: var(--brand-muted); }
    </style>

    <script type="module">
      import { fetchIndex, fetchQuotes, fetchSearch, renderIndexTicker, updateTickTime } from './api-client.js?v=4';
      import {
        getWatchlist, addWatch, removeWatch, isWatched, renderWatchlistTable
      } from './watchlist.js?v=1';
      import { initStockPopup } from './stock-popup.js';

      initStockPopup();

      const listContainer = document.getElementById('watchlist-list');
      const searchInput = document.getElementById('watch-search');
      const searchResults = document.getElementById('search-results');
      const searchClear = document.getElementById('search-clear');
      const watchCount = document.getElementById('watch-count');

      function updateCount() {
        const n = getWatchlist().length;
        watchCount.textContent = `${n} 只`;
      }

      async function loadWatchlist() {
        updateCount();
        try {
          const list = getWatchlist();
          let quotes = [];
          if (list.length > 0) {
            const res = await fetchQuotes(list.map((i) => ({ code: i.code, market: i.market || '' })));
            quotes = res.list || [];
          }
          renderWatchlistTable(list, quotes, listContainer);
          document.getElementById('error-state').classList.add('hidden');
        } catch (err) {
          console.warn('[watchlist] load failed', err);
          document.getElementById('error-state').classList.remove('hidden');
        }
      }
      window.loadWatchlist = loadWatchlist;

      async function loadIndex() {
        try {
          const data = await fetchIndex();
          renderIndexTicker(data);
        } catch (err) {
          console.warn('[index] load failed', err);
        }
      }

      // Search
      let searchAbort;
      async function doSearch(keyword) {
        if (searchAbort) clearTimeout(searchAbort);
        if (!keyword.trim()) {
          searchResults.classList.add('hidden');
          searchResults.innerHTML = '';
          return;
        }
        searchAbort = setTimeout(async () => {
          try {
            const res = await fetchSearch(keyword.trim());
            const list = res.list || [];
            if (list.length === 0) {
              searchResults.innerHTML = `<div class="px-3 py-2 text-sm text-muted-foreground">未找到相关股票</div>`;
              searchResults.classList.remove('hidden');
              return;
            }
            searchResults.innerHTML = list.map((s) => {
              const watched = isWatched(s.code);
              return `
                <div class="search-result-row px-3 py-2.5 flex items-center justify-between gap-2 border-b border-border last:border-0" data-code="${s.code}" data-name="${s.name}" data-market="${s.market || ''}">
                  <div class="min-w-0">
                    <div class="text-sm font-semibold text-foreground cjk-wrap">${s.name}</div>
                    <div class="text-xs text-muted-foreground tabular-nums">${s.code} · ${s.type || 'A股'}</div>
                  </div>
                  <button type="button" class="search-add-btn inline-flex items-center gap-1 px-2.5 py-1 rounded-md text-xs font-medium ${watched ? 'bg-secondary text-secondary-foreground' : 'bg-primary text-primary-foreground'}" data-code="${s.code}" data-name="${s.name}" data-market="${s.market || ''}" data-watched="${watched}">
                    <i data-lucide="${watched ? 'check' : 'plus'}" class="w-3 h-3"></i>
                    <span>${watched ? '已添加' : '添加'}</span>
                  </button>
                </div>
              `;
            }).join('');
            searchResults.classList.remove('hidden');
            if (typeof lucide !== 'undefined') lucide.createIcons();
          } catch (err) {
            console.warn('[search] failed', err);
          }
        }, 250);
      }

      searchInput.addEventListener('input', (e) => {
        const v = e.target.value;
        searchClear.classList.toggle('hidden', !v);
        doSearch(v);
      });
      searchClear.addEventListener('click', () => {
        searchInput.value = '';
        searchClear.classList.add('hidden');
        searchResults.classList.add('hidden');
        searchResults.innerHTML = '';
        searchInput.focus();
      });
      searchResults.addEventListener('click', (e) => {
        const btn = e.target.closest('.search-add-btn');
        const row = e.target.closest('.search-result-row');
        if (btn) {
          e.preventDefault();
          e.stopPropagation();
          const code = btn.dataset.code;
          const name = btn.dataset.name;
          const market = btn.dataset.market;
          if (isWatched(code)) {
            removeWatch(code);
            btn.dataset.watched = 'false';
            btn.className = 'search-add-btn inline-flex items-center gap-1 px-2.5 py-1 rounded-md text-xs font-medium bg-primary text-primary-foreground';
            btn.innerHTML = `<i data-lucide="plus" class="w-3 h-3"></i><span>添加</span>`;
          } else {
            addWatch(code, name, market);
            btn.dataset.watched = 'true';
            btn.className = 'search-add-btn inline-flex items-center gap-1 px-2.5 py-1 rounded-md text-xs font-medium bg-secondary text-secondary-foreground';
            btn.innerHTML = `<i data-lucide="check" class="w-3 h-3"></i><span>已添加</span>`;
          }
          if (typeof lucide !== 'undefined') lucide.createIcons();
          loadWatchlist();
          return;
        }
        if (row && !isWatched(row.dataset.code)) {
          addWatch(row.dataset.code, row.dataset.name, row.dataset.market);
          loadWatchlist();
          doSearch(searchInput.value);
        }
      });

      // Initial
      loadIndex();
      loadWatchlist();
      setInterval(loadIndex, 5000);
      setInterval(loadWatchlist, 5000);
      setInterval(updateTickTime, 1000);
      updateTickTime();

      if (typeof lucide !== 'undefined') lucide.createIcons();
    </script>
</body>
</html>
